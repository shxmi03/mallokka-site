<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena — MALLOKKA</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FEF3D5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241C17" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<script>
/* Primijeni spremljenu temu prije crtanja (isti ključ kao naslovnica: mk-theme) */
(function(){try{var t=localStorage.getItem("mk-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FEF3D5; --surface:#FFFDF6; --ink:#48372F; --ink-2:#6E594C; --muted:#9A8571;
  --line:#EADBBE; --blue:#95BBEA; --blue-deep:#3E6491; --on-blue:#14283F;
  --shadow:0 1px 2px rgba(80,60,25,.05),0 10px 30px rgba(80,60,25,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#241C17; --surface:#31261E; --ink:#FEF3D5; --ink-2:#E3D3B4; --muted:#B29B80;
  --line:#43342A; --blue:#9BA36B; --blue-deep:#C3CB92; --on-blue:#1B1E10;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --paper:#241C17; --surface:#31261E; --ink:#FEF3D5; --ink-2:#E3D3B4; --muted:#B29B80;
  --line:#43342A; --blue:#9BA36B; --blue-deep:#C3CB92; --on-blue:#1B1E10;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:grid; place-items:center; padding:40px 22px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.box{max-width:560px; text-align:center}
.logo{height:40px; width:auto; margin:0 auto 30px; display:block}
:root[data-theme="dark"] .logo{filter:invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
.eyebrow{
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--blue-deep); font-weight:700;
}
h1{
  font-family:Fraunces,Georgia,serif; font-weight:900;
  font-size:clamp(64px,16vw,120px); line-height:1; letter-spacing:-.02em;
  margin:10px 0 6px; color:var(--ink);
}
h2{
  font-family:Fraunces,Georgia,serif; font-weight:600;
  font-size:clamp(22px,4.4vw,30px); margin:0 0 14px; color:var(--ink);
}
p{color:var(--ink-2); font-size:15.5px; margin:0 auto 30px; max-width:44ch}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--blue); color:var(--on-blue); text-decoration:none;
  font-weight:600; font-size:15px; padding:13px 24px; border-radius:999px;
  box-shadow:var(--shadow); transition:transform .15s ease, filter .15s ease;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px)}
.small{margin-top:26px; font-size:13px; color:var(--muted)}
.small a{color:var(--blue-deep); text-decoration:none}
.small a:hover{text-decoration:underline}
</style>
</head>
<body>
<main class="box">
  <img class="logo" src="assets/logo-wordmark.png" width="409" height="113" alt="mallokka by Karla">
  <span class="eyebrow">Greška 404</span>
  <h1>404</h1>
  <h2>Stranica nije pronađena</h2>
  <p>Adresa koju ste otvorili ne postoji ili je premještena. Vratite se na naslovnicu — tu smo za sva pitanja.</p>
  <a class="btn" href="/">← Natrag na naslovnicu</a>
  <div class="small">MALLOKKA — Marketing &amp; social media · Zadar · <a href="mailto:mallokka.agency@gmail.com">mallokka.agency@gmail.com</a></div>
</main>
</body>
</html>
